name: VeyraOS CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://mock-project-id.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: mock-publishable-key-for-ci
  NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key-for-ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  test:
    name: Unit & Financial Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite (100% Pass Required)
        run: npm run test

  typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck (tsc --noEmit)
        run: npm run type-check

  lint:
    name: Code Quality & ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Next.js Production Build Validation
    runs-on: ubuntu-latest
    needs: [test, typecheck, lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production Bundle
        run: npm run build
